<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Fair Night</title>
<style>
html,body{margin:0;min-height:100%;background:#09090e;color:#fffaf4;font-family:Inter,system-ui,-apple-system,"SF Pro Display",sans-serif}body{display:grid;place-items:center}.boot{text-align:center;padding:28px}.wheel{font-size:42px}.boot b{display:block;margin-top:10px;font-size:18px}.boot span{display:block;margin-top:6px;color:#aaa7b6;font-size:13px;line-height:1.45}.err{color:#ffb09f;max-width:360px}.retry{margin-top:18px;border:0;border-radius:16px;background:#ff4f86;color:white;padding:14px 24px;font-weight:900;font-size:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div class="boot" id="boot"><div class="wheel">🎡</div><b>Opening Fair Night…</b><span>Loading tonight’s plan, tickets and GPS pins.</span></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  const fail=(err)=>{boot.innerHTML='<div class="wheel">🎡</div><b>Couldn’t open Fair Night</b><span class="err">'+String(err&&err.message||err)+'</span><button class="retry" onclick="location.reload()">Try again</button>'};
  try{
    if(!window.pako) throw new Error('Decoder did not load');
    const r=await fetch('/ocfair/app-v10.b64?v=10',{cache:'no-store'});
    if(!r.ok) throw new Error('App payload not found ('+r.status+')');
    const b64=(await r.text()).replace(/\s+/g,'');
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const app=window.pako.ungzip(bytes,{to:'string'});
    if(!app || !app.includes('<html')) throw new Error('App data was incomplete');
    document.open();document.write(app);document.close();
  }catch(err){fail(err)}
})();
</script>
</body>
</html>
