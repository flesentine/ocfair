name: Install UX V21

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-ux-v21.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate V21 JavaScript
        run: node --check ux-v21.js
      - name: Wire V21 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Fair Night — Visual UX V20</title>','<title>Fair Night — Refined UX V21</title>',1)
          if 'ux-v21.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./ux-v21.css?v=21">\n</head>',1)
          if 'ux-v21.js' not in s:
              marker='<script src="./ux-v20.js?v=20"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n<script src="./ux-v21.js?v=21"></script>',1)
              else:
                  s=s.replace('<script>document.addEventListener(\'dblclick\'','<script src="./ux-v21.js?v=21"></script>\n<script>document.addEventListener(\'dblclick\'',1)
          if 'ux-v21.css?v=21' not in s or 'ux-v21.js?v=21' not in s:
              raise SystemExit('V21 assets missing')
          if '28799441' in s or '465873631' in s:
              raise SystemExit('Private Etix credentials detected')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/app.js').write_text(max(inline,key=len),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit V21
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deploy refined UX V21'
          git push origin HEAD:main
