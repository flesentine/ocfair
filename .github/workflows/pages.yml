name: Apply OC Fair readability pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add high-contrast outdoor CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<style id="readability-v15">' in s:
              print('Readability pass already present')
              raise SystemExit(0)
          b64=''
          css=base64.b64decode(b64).decode('utf-8')
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('Manual Arrival V14','Outdoor Readability V15')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit readable app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Improve outdoor readability and contrast'
          git push origin HEAD:main
