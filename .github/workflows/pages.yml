name: Validate OC Fair app

on:
  push:
    branches:
      - main
    paths:
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          if '28799441' in s or '465873631' in s:
              raise SystemExit('Private Etix credentials detected')
          if '</html>' not in s[-500:]:
              raise SystemExit('HTML incomplete')
          blocks = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', s, re.S)
          Path('/tmp/ocfair.js').write_text(max(blocks, key=len), encoding='utf-8')
          PY
          node --check /tmp/ocfair.js
