name: Repair live OC Fair app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-live-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair and verify exact live build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Repair the byte corruption introduced by the bad gzip payload recovery.
          broken = "function renderAll(){renderFocus();renderUpcoming();renderTimeline()');renderMissions(renderPace()}"
          fixed  = "function renderAll(){renderFocus();renderUpcoming();renderTimeline();renderMissions();renderPace()}"
          if broken in text:
              text = text.replace(broken, fixed, 1)

          # Swap direct localStorage calls before inserting the wrapper itself.
          text = text.replace('localStorage.getItem(', 'storeGet(')
          text = text.replace('localStorage.setItem(', 'storeSet(')
          text = text.replace('localStorage.removeItem(', 'storeRemove(')

          anchor = "const TICKET_KEY='fair-ticket-url';"
          wrapper = """const TICKET_KEY='fair-ticket-url';
          const memoryStore=Object.create(null);
          function storeGet(key){
            try{
              const v=window['localStorage'].getItem(key);
              if(v!==null) memoryStore[key]=v;
              return v!==null?v:(Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:null);
            }catch(e){
              return Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:null;
            }
          }
          function storeSet(key,value){
            const v=String(value);
            memoryStore[key]=v;
            try{window['localStorage'].setItem(key,v)}catch(e){}
          }
          function storeRemove(key){
            delete memoryStore[key];
            try{window['localStorage'].removeItem(key)}catch(e){}
          }"""
          if 'function storeGet(key)' not in text:
              if anchor not in text:
                  raise SystemExit('Ticket-key insertion point missing')
              text = text.replace(anchor, wrapper, 1)

          old_time = """function nowLA(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());let o={};p.forEach(x=>o[x.type]=x.value);return (+o.hour)*60+(+o.minute)}
          function clockLA(){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).format(new Date())}"""
          new_time = """function nowLA(){
           const d=new Date();
           try{
            const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);let o={};p.forEach(x=>o[x.type]=x.value);return (+o.hour)*60+(+o.minute);
           }catch(e){return d.getHours()*60+d.getMinutes()}
          }
          function clockLA(){
           const d=new Date();
           try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).format(d)}
           catch(e){return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
          }"""
          if old_time in text:
              text = text.replace(old_time, new_time, 1)

          old_init = "setupTickets();setupExplore();renderPrep();renderAll();setInterval(()=>{renderFocus();renderUpcoming()},60000);"
          new_init = """try{setupTickets()}catch(e){console.warn('Tickets setup skipped',e)}
          try{setupExplore()}catch(e){console.warn('Explore setup skipped',e)}
          try{renderPrep()}catch(e){console.warn('Prep render skipped',e)}
          renderAll();
          setInterval(()=>{try{renderFocus();renderUpcoming()}catch(e){console.warn('Live refresh skipped',e)}},60000);"""
          if old_init in text:
              text = text.replace(old_init, new_init, 1)

          text = text.replace('<title>Fair Night — Public Safe V10</title>', '<title>Fair Night — Robust Live V13</title>', 1)

          if '28799441' in text or '465873631' in text:
              raise SystemExit('Private Etix credentials detected; refusing to publish')
          if 'localStorage.getItem(' in text or 'localStorage.setItem(' in text or 'localStorage.removeItem(' in text:
              raise SystemExit('Unsafe direct localStorage call remains')
          if '</html>' not in text[-500:]:
              raise SystemExit('HTML appears incomplete')

          p.write_text(text, encoding='utf-8')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S)
          for i, script in enumerate(scripts):
              js = Path(f'/tmp/app-{i}.js')
              js.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(js)], check=True)

          digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
          expected = '5bfbbe19941a6145f7f639ac304cbc22aa955696612d363601260246d440e124'
          print('SHA-256:', digest)
          if digest != expected:
              raise SystemExit(f'Build differs from verified clean target: {digest}')
          print('Exact verified build produced')
          PY

      - name: Commit repaired index.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches verified build.'
            exit 0
          fi
          git commit -m 'Repair live clock and itinerary runtime'
          git push origin HEAD:main
