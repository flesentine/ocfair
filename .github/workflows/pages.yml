name: Apply exact OC Fair map pins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Apple Maps to literal dropped pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""function appleMapsURL(destination){const raw=String(destination||'').trim();const match=raw.match(/^(-?\\d+(?:\\.\\d+)?),\\s*(-?\\d+(?:\\.\\d+)?)$/);if(match){const lat=match[1],lon=match[2];return`https://maps.apple.com/?daddr=${lat},${lon}&dirflg=w&t=m`}return'https://maps.apple.com/?daddr='+encodeURIComponent(raw)+'&dirflg=w&t=m'}function openAppleMaps(destination){if(!destination){toast('No GPS pin for this stop');return}window.location.href=appleMapsURL(destination)}"""
          new="""function appleMapsURL(destination,name){const raw=String(destination||'').trim();const label=String(name||'OC Fair stop').trim();const match=raw.match(/^(-?\\d+(?:\\.\\d+)?),\\s*(-?\\d+(?:\\.\\d+)?)$/);if(match){const lat=match[1],lon=match[2];return`https://maps.apple.com/place?coordinate=${lat},${lon}&name=${encodeURIComponent(label)}&map=hybrid`}return'https://maps.apple.com/search?query='+encodeURIComponent(raw)}function openAppleMaps(destination,name){if(!destination){toast('No GPS pin for this stop');return}window.location.href=appleMapsURL(destination,name)}"""
          if old not in s:
              raise SystemExit('Apple Maps function anchor not found')
          s=s.replace(old,new,1)

          # Live itinerary buttons: pass a human label with the literal coordinate.
          s=s.replace("openAppleMaps(e.map||e.loc)","openAppleMaps(e.map||e.loc,e.loc)")

          # Explore cards: use each card title as the pin name.
          s=s.replace("openAppleMaps(c.dataset.map)","openAppleMaps(c.dataset.map,c.querySelector('h3')?.textContent.replace('BEST FIT','').trim()||'OC Fair stop')")

          # Quick-action sheet: every temporary fair stand gets an explicit named coordinate pin.
          replacements={
            "openAppleMaps('33.66617,-117.90208')":"openAppleMaps('33.66617,-117.90208','Craft Brew East')",
            "openAppleMaps('33.66700,-117.90084')":"openAppleMaps('33.66700,-117.90084','Beers of the World')",
            "openAppleMaps('33.66636,-117.90108')":"openAppleMaps('33.66636,-117.90108','La Cantina')",
            "openAppleMaps('33.66599,-117.90253')":"openAppleMaps('33.66599,-117.90253','Centennial Farm')",
            "openAppleMaps('33.66630,-117.89830')":"openAppleMaps('33.66630,-117.89830','Main Carnival')",
          }
          for a,b in replacements.items(): s=s.replace(a,b)

          # Expose the literal coordinates so there is no ambiguity about the target.
          drink_coords={
            'Craft Brew East':'33.66617, -117.90208',
            'Beers of the World':'33.66700, -117.90084',
            'La Cantina':'33.66636, -117.90108',
            'Hangar Bar':'33.66776, -117.90091',
            'Main Mall Margaritas / Micheladas':'33.66700, -117.90084',
          }
          for title,coord in drink_coords.items():
              pat=rf'(<h3>{re.escape(title)}(?: <span class="bestBadge">BEST FIT</span>)?</h3><p>.*?</p><div class="placeMeta">.*?</div>)'
              def add(m,coord=coord):
                  block=m.group(1)
                  if 'coordText' in block: return block
                  return block+f'<div class="coordText">📍 {coord}</div>'
              s,n=re.subn(pat,add,s,count=1)
              if n!=1:
                  raise SystemExit(f'Could not annotate coordinate for {title}')

          # Make the coordinate readout legible and update wording/buttons.
          if '.coordText{' not in s:
              css='''<style id="exact-pin-v16">.coordText{margin-top:7px;font-size:11px;line-height:1.35;color:#ffd15d;font-weight:800;letter-spacing:.01em}.mapPill{min-width:116px}</style>'''
              s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace(' Maps · GPS pin',' Maps · exact pin')
          s=s.replace(' Maps · GPS',' Maps · exact pin')
          s=s.replace('Apple Maps now gets coordinates','Apple Maps now opens literal dropped pins')
          s=s.replace('The map buttons send latitude/longitude directly instead of asking Apple to search the venue name. Permanent buildings use mapped centers; temporary Fair zones and stands use a pin placed in their Fair-map zone.','The map buttons now open a named Apple Maps place card at the literal latitude/longitude. This avoids Apple Maps snapping an internal fair destination back to the generic OC Fair venue.')
          s=s.replace('No more collapsing every destination to 88 Fair Drive.','Each button opens a distinct dropped pin inside the fairgrounds.')
          s=s.replace('Outdoor Readability V15','Exact Pins V16')

          # Security / integrity checks.
          if '28799441' in s or '465873631' in s:
              raise SystemExit('Private Etix credentials detected')
          if 'maps.apple.com/?daddr=' in s:
              raise SystemExit('Old snapping directions URL still present')
          if 'maps.apple.com/place?coordinate=' not in s:
              raise SystemExit('Exact place URL missing')
          if '</html>' not in s[-500:]:
              raise SystemExit('HTML incomplete')

          p.write_text(s,encoding='utf-8')
          print('Exact dropped-pin map patch applied')
          PY

      - name: Commit exact-pin app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Make Apple Maps open exact internal fair pins'
          git push origin HEAD:main
