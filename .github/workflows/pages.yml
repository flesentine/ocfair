name: Publish plain OC Fair app

on:
  push:
    branches: [main]
    paths:
      - app-v10.b64
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Expand and validate sanitized app
        shell: bash
        run: |
          set -u
          set +e
          base64 -d app-v10.b64 | gzip -dc > index.new.html
          gzip_status=$?
          set -e
          echo "gzip status: $gzip_status"

          test -s index.new.html
          size=$(wc -c < index.new.html)
          echo "expanded HTML bytes: $size"
          test "$size" -gt 45000
          grep -q '<html' index.new.html
          grep -q 'Fair Night' index.new.html
          tail -c 300 index.new.html | grep -q '</html>'

          if grep -qE '28799441|465873631' index.new.html; then
            echo 'Private Etix credentials detected; refusing to publish.' >&2
            exit 1
          fi

          mv index.new.html index.html

      - name: Commit plain index.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'Publish plain Safari-safe app'
          git push origin HEAD:main
