name: Install Complete Schedule V24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-schedule-v24.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate V24 assets
        run: |
          node --check schedule-v24.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('schedule-v24.js').read_text()
          n=s.count("    S('")
          print('official rows:',n)
          if n != 55: raise SystemExit(f'Expected 55 official rows, found {n}')
          PY
      - name: Wire V24 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Fair Night — Expanded V23</title>','<title>Fair Night — Complete Schedule V24</title>',1)
          if 'schedule-v24.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./schedule-v24.css?v=24">\n</head>',1)
          if 'schedule-v24.js' not in s:
              marker='<script src="./expand-v23.js?v=23"></script>'
              if marker not in s: raise SystemExit('V23 marker missing')
              s=s.replace(marker,marker+'\n<script src="./schedule-v24.js?v=24"></script>',1)
          if 'schedule-v24.css?v=24' not in s or 'schedule-v24.js?v=24' not in s:
              raise SystemExit('V24 assets missing')
          if '28799441' in s or '465873631' in s:
              raise SystemExit('Private Etix credentials detected')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/app.js').write_text(max(inline,key=len),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit V24
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deploy complete official schedule V24'
          git push origin HEAD:main
