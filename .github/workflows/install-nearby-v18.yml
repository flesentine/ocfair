name: Install Near Me V18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-nearby-v18.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Near Me JavaScript
        run: node --check nearby-v18.js
      - name: Wire Near Me into the app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Fair Night — Live Explore V17</title>','<title>Fair Night — GPS Near Me V18</title>',1)
          if 'nearby-v18.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./nearby-v18.css?v=18">\n</head>',1)
          if 'nearby-v18.js' not in s:
              s=s.replace('<script>document.addEventListener(\'dblclick\'','<script src="./nearby-v18.js?v=18"></script>\n<script>document.addEventListener(\'dblclick\'',1)
          if 'nearby-v18.css' not in s or 'nearby-v18.js' not in s:
              raise SystemExit('Near Me assets were not linked')
          if '28799441' in s or '465873631' in s:
              raise SystemExit('Private Etix credentials detected')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/app.js').write_text(max(inline,key=len),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit V18
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable GPS-aware Near Me mode'
          git push origin HEAD:main
